name: Build NovaClient

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle kur ve yapılandır
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          cache-disabled: true

      - name: Gradle projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "::error::build.gradle bulunamadı!"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          if [ ! -f "$DIR/settings.gradle" ] && \
             [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle bulunamadı!"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proje klasörü: $DIR"

      - name: Gradle görevlerini kontrol et
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon tasks

      - name: Modu derle
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean build

      - name: JAR dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient-JAR
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
